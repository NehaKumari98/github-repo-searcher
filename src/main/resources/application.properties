spring.application.name=github-repo-searcher
server.port=8090

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/github_search}   
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changewithyourpassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs